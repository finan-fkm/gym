# Render Blueprint Specification (IaC)
# See https://render.com/docs/blueprints for details.
# This blueprint deploys:
# 1. A PostgreSQL Database (gym-db)
# 2. A Node.js Express Backend Service (gym-backend)
# 3. A Static Site React Frontend Service (gym-frontend)

services:
  # -------------------------------------------------------------
  # Express Backend Web Service
  # -------------------------------------------------------------
  - type: web
    name: gym-backend
    runtime: node
    rootDir: server
    buildCommand: npm install
    startCommand: npm run seed && npm start
    envVars:
      - key: PORT
        value: 5000
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: gym-db
          property: connectionString

  # -------------------------------------------------------------
  # Static Frontend Web Service
  # -------------------------------------------------------------
  - type: web
    name: gym-frontend
    runtime: static
    buildCommand: npm install && npm run build
    publishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: gym-backend
          property: host

databases:
  # -------------------------------------------------------------
  # PostgreSQL Database Instance
  # -------------------------------------------------------------
  - name: gym-db
    plan: free # Deploys on the free tier of Render PostgreSQL
